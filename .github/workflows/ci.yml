# Проверка на каждый push и pull request: сборка и тесты на Linux и Windows (через настоящий
# именованный канал). Выпусков здесь нет, они в release.yml.
# Идентичность src/local_ipc с b-1c-masking-service сторожит контрольная сумма local_ipc.sha256
# (одна и та же в обоих репозиториях); полное сравнение (diff -r) выполняется при приёмке.
name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Контрольная сумма local_ipc
        if: runner.os != 'Windows'
        run: |
          cd src/local_ipc
          test "$(cat mod.rs policy.rs tests.rs unix.rs windows.rs | sha256sum | cut -d' ' -f1)" = "$(cat ../../local_ipc.sha256)"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked

  # Два настоящих .exe в Windows: служба и менеджер запускаются процессами, скрипт ходит в их
  # именованные каналы как клиент (см. scripts/ci/windows-smoke.ps1). Заодно даёт артефакт —
  # релизный v8-session-manager.exe — без публикации релиза.
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: manager
      # Служба берётся из ветки с тем же переносом; после слияния сменить на основную ветку.
      - uses: actions/checkout@v6
        with:
          repository: Borisskin/1c-masking-service
          ref: feature/windows-named-pipe-ipc
          path: service
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            manager
            service
      - name: Сборка менеджера
        working-directory: manager
        run: cargo build --release --locked
      - name: Сборка службы
        working-directory: service
        run: cargo build --release --locked --bin masking-service
      - name: Дымовая проверка двух .exe
        shell: pwsh
        run: >
          ./manager/scripts/ci/windows-smoke.ps1
          -ServiceExe service/target/release/masking-service.exe
          -ManagerExe manager/target/release/v8-session-manager.exe
          -WorkDir $env:RUNNER_TEMP/smoke
      - name: Артефакт менеджера (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: v8-session-manager-windows-x86_64
          path: manager/target/release/v8-session-manager.exe
          if-no-files-found: error
